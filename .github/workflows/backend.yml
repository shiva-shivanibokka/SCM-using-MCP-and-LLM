name: backend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch + backend deps)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
          pip install -r backend/requirements.txt pytest
      - name: Generate data
        run: python data/generate_data.py
      # `backend/tests` alone left the top-level `tests/` directory out of CI
      # entirely -- the sandbox-escape, SQL file-access, REPL-timeout and
      # stockout-velocity regression tests among them. Every one of those could
      # have regressed with this workflow green, which is the opposite of what a
      # guard is for.
      - name: Run fast tests
        run: python -m pytest backend/tests tests -v -k "not chronos and not nhits"
